# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
defaults: &defaults
  working_directory: ~/ratpack
  docker:
    - image: cimg/openjdk:11.0
  resource_class: large
  environment:
    TERM: dumb
    GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx1g"

version: 2.1
orbs:
  gcp-gcr: circleci/gcp-gcr@0.16.1
  cloudrun: circleci/gcp-cloud-run@1.0.2
jobs:
  sanity-check:
    <<: *defaults
    steps:
      - checkout

      - restore_cache:
          keys:
            - v3-gradle-{{ .Branch }}-{{ .Revision }}
            - v3-gradle-{{ .Branch }}
            - v3-gradle-master
            - v3-gradle
            -
      - run:
          name: Run
          command: ./gradlew sanityCheck --continue --max-workers=3 --build-cache

      - save_cache:
          paths:
            - ~/.gradle
          key: v3-gradle-{{ .Branch }}-{{ .Revision }}
          when: always

      - persist_to_workspace:
          root: ~/ratpack
          paths:
            - "*/build/**"
  build:
    <<: *defaults
    steps:
      - checkout

      - attach_workspace:
          at: ~/ratpack

      - run:
          name: Run
          command: ./gradlew build jacocoReport -PjacocoReport --continue --max-workers=3 --build-cache -PpublishToSlack

      - run:
          name: Save test results
          command: |
            mkdir -p ~/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/junit/ \;
          when: always

      - run:
          name: Upload Coverage Results
          command: bash <(curl -s https://codecov.io/bash)
          when: always

      - store_test_results:
          path: ~/junit

      - persist_to_workspace:
          root: ~/ratpack
          paths:
            - "*/build/**"

  uploadArtifacts:
    <<: *defaults
    steps:
      - checkout

      - attach_workspace:
          at: ~/build

      - run:
          name: Upload Artifacts
          command: ./gradlew publishToSonatypeOss --max-workers=1

  deploySite:
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false

      - attach_workspace:
          at: ~/ratpack

      - run:
          name: Install/Update Google Cloud SDK
          command: |
            # Remove any existing gcloud installation to avoid conflicts
            sudo rm -rf /home/circleci/google-cloud-sdk || true
            # Download and install Google Cloud SDK non-interactively
            cd /home/circleci
            curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-458.0.1-linux-x86_64.tar.gz
            tar -xf google-cloud-cli-458.0.1-linux-x86_64.tar.gz
            ./google-cloud-sdk/install.sh --quiet --usage-reporting=false --path-update=true
            echo 'export PATH="$HOME/google-cloud-sdk/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Setup Google Cloud credentials and environment
          command: |
            # Decode the service account key.
            echo "${GCP_PROJECT_KEY}" | tr -d '[:space:]' | base64 --decode > $HOME/gcloud-service-key.json
            # Set environment variables for orbs and subsequent steps
            echo 'export GOOGLE_CLOUD_KEYS=$(cat $HOME/gcloud-service-key.json)' >> $BASH_ENV
            echo "export TAG=${CIRCLE_SHA1}" >> $BASH_ENV
            echo "export IMAGE_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV

      - run:
          name: Build Image
          command: |
            source $BASH_ENV
            ./gradlew :ratpack-site:jibDockerBuild --image=$IMAGE_NAME:$TAG --build-cache

      - run:
          name: Authenticate with Google Cloud
          command: |
            # Load environment variables
            source $BASH_ENV
            # Use the validated service account key
            gcloud auth activate-service-account --key-file=$HOME/gcloud-service-key.json
            gcloud config set project $GOOGLE_PROJECT_ID
            gcloud auth configure-docker --quiet

      - gcp-gcr/gcr-auth:
          gcloud-service-key: GOOGLE_CLOUD_KEYS
          google-project-id: GOOGLE_PROJECT_ID
          google-compute-zone: GOOGLE_COMPUTE_ZONE
      - gcp-gcr/push-image:
          google-project-id: GOOGLE_PROJECT_ID
          registry-url: "us.gcr.io"
          image: $IMAGE_NAME
      - cloudrun/deploy:
          platform: "managed"
          image: "us.gcr.io/$GOOGLE_PROJECT_ID/$IMAGE_NAME"
          service-name: "ratpack-site"
          region: $GOOGLE_COMPUTE_ZONE
          unauthenticated: true
workflows:
  version: 2
  build_and_publish:
    jobs:
      - sanity-check:
          filters:
            branches:
              ignore: gh-pages
      - build:
          requires:
            - sanity-check
          filters:
            branches:
              ignore: gh-pages
      - uploadArtifacts:
          requires:
            - build
          filters:
            branches:
              only: 1.10.x
      - deploySite:
          requires:
            - build
          filters:
            branches:
              only: 1.10.x
