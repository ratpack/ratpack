def ci = !!System.getenv("CI")

// Set ratpackDevelocityBuildCache=true to use the build cache of the Develocity server set with ratpackDevelocityServer.
// Builds on CI store their outputs in it; other builds only read from it.
// Set ratpackDevelocityBuildCachePush to override that, e.g. false for a CI build whose outputs no other build reuses.
def useDevelocityBuildCache = settings.hasProperty("ratpackDevelocityBuildCache") && Boolean.parseBoolean(settings.ratpackDevelocityBuildCache.toString())
def pushToDevelocityBuildCache = settings.hasProperty("ratpackDevelocityBuildCachePush") ? Boolean.parseBoolean(settings.ratpackDevelocityBuildCachePush.toString()) : ci

if (useDevelocityBuildCache) {
  if (!(settings.hasProperty("ratpackDevelocityServer") && settings.ratpackDevelocityServer)) {
    throw new GradleException("ratpackDevelocityBuildCache needs ratpackDevelocityServer to be set to the Develocity server whose build cache to use")
  }

  buildCache {
    remote(develocity.buildCache) {
      enabled = true
      push = pushToDevelocityBuildCache
    }
  }
}
